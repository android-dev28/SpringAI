spring.application.name=SpringIA
server.port = 9003

spring.ai.ollama.chat.options.model=qwen2.5-coder:7b
spring.ai.ollama.api-key=${API_KEY}
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.temperature=0.2
#this will be enable or disable chat client
spring.ai.chat.client.enabled=true

#DB Configurations
spring.datasource.url=jdbc:mariadb://localhost:3308/springia
spring.datasource.username=root
spring.datasource.password=root123

# MariaDB Vector Store
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=1024

logging.level.org.springframework.ai.chat.client.advisor=DEBUG